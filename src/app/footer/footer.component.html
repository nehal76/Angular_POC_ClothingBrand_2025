<footer class="footer-dev">
  <div class="container-fluid">
    <div class="useful-part">
      <div>
        <span class="bar-line"></span>
        <h3>Useful Links</h3>
      </div>
      <div class="footer-Links">
        <ul class="footer-ul" >
          <!-- <span class="bar-line"></span> -->
          <li>Home</li>

          <li>Contact</li>
          <li>About</li>
          <li>Shopping</li>
          <li>Support</li>
          <li>FAQs</li>
          <li>Terms & Conditions</li>
          <li>Privacy Policy</li>
        </ul>
      </div>
      <div class="footer-copywright">
        <p>© 2026 Velora. All rights reserved.</p>
      </div>
    </div>
    <div>
      <div class="recommended-heading">
        <h3>Recommended Products</h3>
      </div>
      <div class="recommended-products">
        <div class="row g-3 w-20 max-auto">
          <div
            class="col-12 col-sm-6 col-md-4 col-lg-6"
            *ngFor="let product of products"
          >
            <div class="card h-100 text-center">
              <img
                [src]="product.image"
                class="card-img-top fixed-img"
                alt="{{ product.name }}"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ product.name }}</h5>
                <button class="btn btn-secondary mt-auto">View</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <h1>Contact us</h1>

      <form style="width: 22rem" class="container mt-3">
        <!-- Name input -->
        <div data-mdb-input-init class="form-outline mb-4">
          <input type="text" id="form5Example1" class="form-control" />
          <label class="form-label" for="form5Example1" style="color: lightgray"
            >Name</label
          >
        </div>

        <!-- Email input -->
        <div data-mdb-input-init class="form-outline mb-4">
          <input type="email" id="form5Example2" class="form-control" />
          <label class="form-label" for="form5Example2" style="color: lightgray"
            >Email address</label
          >
        </div>

        <textarea class="form-control" aria-label="With textarea"></textarea>

        <!-- Checkbox -->
        <div class="form-check d-flex justify-content-center mb-4">
          <input
            class="form-check-input me-2"
            type="checkbox"
            value=""
            id="form5Example3"
            checked
          />
          <label class="form-check-label" for="form5Example3">
            I have read and agree to the terms
          </label>
        </div>

        <!-- Submit button -->
        <button
          data-mdb-ripple-init
          type="button"
          class="btn btn-secondary btn-block mb-4"
          (click)="clickEvent()"
        >
          Submit
        </button>
      </form>
      <div class="scrollToTop-container">
        <div
          class="btn btn-secondary btn-block mb-1"
          style="border-radius: 15px"
        >
          <button (click)="scrollToTop()" class="scrollToTop-button">
            scrollToTop
          </button>
        </div>
      </div>
    </div>
  </div>
</footer>
