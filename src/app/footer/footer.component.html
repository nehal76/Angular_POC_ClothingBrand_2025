<footer class="footer-dev">
  <div class="container-headings"  >
    <h5>Usefull Links</h5>
    <h5 style="padding-left: 5px">Recommended Product</h5>
    <h5 style="padding-left: 23px">Contact US</h5>
  </div>
  <div class="container-fluid" style="padding-top: 0; padding-top: 0;">
    <div class="useful-part" >
      <!-- <h3 class="footer-headings">Useful Links</h3> -->
      <div class="footer-Links">
        <ul class="footer-ul">
          <!-- <span class="bar-line"></span> -->
          <li>Home</li>

          <li>Contact</li>
          <li>About</li>
          <li>Shopping</li>
          <li>Support</li>
          <li>FAQs</li>
          <li>Terms & Conditions</li>
          <li>Privacy Policy</li>
        </ul>
      </div>
      <div class="footer-copywright">
        <p>© 2026 Velora. All rights reserved.</p>
      </div>
    </div>
    <!-- Middle part is start -->

    <div class="recommended-part">
      <!-- <h3 class="footer-headings">Recommended Products</h3> -->

      <div class="recommended-products">
        <div class="row g-3 w-20 max-auto">
          <div
            class="col-12 col-sm-6 col-md-4 col-lg-6"
            *ngFor="let product of products"
          >
            <div class="card h-100 text-center">
              <img
                [src]="product.image"
                class="card-img-top fixed-img"
                alt="{{ product.name }}"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ product.name }}</h5>
                <button class="btn btn-secondary mt-auto">View</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <!-- <h3 class="footer-headings">Contact us</h3> -->

      
<form #f="ngForm" (ngSubmit)="submitForm(f)" style="width: 22rem" class="container mt-3">

  <!-- Name -->
  <div class="form-outline mb-4">
    <input
      type="text"
      class="form-control"
      name="name"
      ngModel
      required
    />
    <label class="form-label" style="color: lightgray">Name</label>
  </div>

  <!-- Email -->
  <div class="form-outline mb-4">
    <input
      type="email"
      class="form-control"
      name="email"
      ngModel
      required
    />
    <label class="form-label" style="color: lightgray">Email address</label>
  </div>

  <!-- Message -->
  <textarea
    class="form-control mb-3"
    name="message"
    ngModel
    placeholder="Your message"
    required
  ></textarea>

  <!-- Checkbox -->
  <div class="form-check d-flex justify-content-center mb-4">
    <input
      class="form-check-input me-2"
      type="checkbox"
      name="terms"
      ngModel
      checked
    />
    <label class="form-check-label">
      I have read and agree to the terms
    </label>
  </div>

  <!-- ✅ SUBMIT button -->
  <button
    type="submit"
    class="btn btn-secondary btn-block mb-4"
  >
    Submit
  </button>

</form>
``

      <div class="scrollToTop-container">
        <div
          class="btn btn-secondary btn-block mb-1"
          style="border-radius: 15px"
        >
          <button (click)="scrollToTop()" class="scrollToTop-button">
            scrollToTop
          </button>
        </div>
      </div>
    </div>
  </div>
</footer>
